[changelog]
# changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
# remove the leading and trailing whitespace from the template
trim = true
# changelog footer
footer = """
<!-- generated by git-cliff -->
"""

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = false
# filter out the commits that are not conventional
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
    # Keep gitmoji codes for parsing
]
# regex for parsing and grouping commits
commit_parsers = [
    { message = "^.*feat:", group = "Features" },
    { message = "^.*fix:", group = "Bug Fixes" },
    { message = "^.*update:", group = "Refactoring" },
    { message = "^.*doc:", group = "Documentation" },
    { message = "^.*:heavy_plus_sign:", group = "Dependencies" },
    { message = "^.*security:", group = "Security" },
    { message = "^.*:white_check_mark:", group = "Tests" },
    { message = "^.*:arrow_up:", group = "Upgrades" },
    { message = "^.*WIP:", group = "Work in Progress" },
    { message = "^.*Merge pull request", skip = true },
    { message = "^.*chore\\(deps\\):", group = "➕ Dependencies" },
    { message = "^.*ci:", group = "CI" },
    { message = "^.*chore:", group = "Chore" },
    { message = "^.*", group = "Other" },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false
# filter out the commits that are not matched by commit parsers
filter_commits = false
# glob pattern for matching git tags
tag_pattern = "v[0-9]*"
# regex for skipping tags
skip_tags = ""
# regex for ignoring tags
ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"
