basePath: /
definitions:
  controllers.ChallengeResponse:
    properties:
      challenge_id:
        type: string
      expires_at:
        type: integer
      transaction:
        type: string
    type: object
  controllers.VerifyRequest:
    properties:
      challenge_id:
        type: string
      signed_transaction:
        type: string
    required:
    - challenge_id
    - signed_transaction
    type: object
  controllers.VerifyResponse:
    properties:
      expires_at:
        type: integer
      token:
        type: string
    type: object
  fiber.Error:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.C2BNotificationWire:
    properties:
      BillRefNumber:
        type: string
      BusinessShortCode:
        type: string
      FirstName:
        type: string
      InvoiceNumber:
        type: string
      LastName:
        type: string
      MSISDN:
        type: string
      MiddleName:
        type: string
      OrgAccountBalance:
        type: string
      ThirdPartyTransID:
        type: string
      TransAmount:
        type: string
      TransID:
        type: string
      TransTime:
        type: string
      TransactionType:
        type: string
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ExpressCallbackBody:
    properties:
      stkCallback:
        $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ExpressCallbackResult'
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ExpressCallbackEnvelope:
    properties:
      Body:
        $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ExpressCallbackBody'
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ExpressCallbackMetadataHolder:
    properties:
      Item:
        items:
          $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ExpressCallbackMetadataItem'
        type: array
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ExpressCallbackMetadataItem:
    properties:
      Name:
        type: string
      Value:
        items:
          type: integer
        type: array
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ExpressCallbackResult:
    properties:
      CallbackMetadata:
        $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ExpressCallbackMetadataHolder'
      CheckoutRequestID:
        type: string
      MerchantRequestID:
        type: string
      ResultCode:
        type: integer
      ResultDesc:
        type: string
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.HakikishaRequest:
    properties:
      accountNumber:
        description: |-
          AccountNumber is the reference the payer typed on their handset, so it
          arrives exactly as they typed it.
        type: string
      shortCode:
        type: string
      timestamp:
        description: Timestamp arrives as either a string or a number.
        type: integer
      transactionId:
        type: string
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.HakikishaResponse:
    properties:
      accountName:
        type: string
      accountNumber:
        type: string
      responseCode:
        type: string
      responseDesc:
        type: string
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.RawResult:
    properties:
      ConversationID:
        type: string
      OriginatorConversationID:
        type: string
      ReferenceData:
        properties:
          ReferenceItem:
            items:
              type: integer
            type: array
        type: object
      ResultCode:
        items:
          type: integer
        type: array
      ResultDesc:
        type: string
      ResultParameters:
        properties:
          ResultParameter:
            items:
              type: integer
            type: array
        type: object
      ResultType:
        type: integer
      TransactionID:
        type: string
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ResultEnvelope:
    properties:
      Result:
        $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.RawResult'
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ValidationResponse:
    properties:
      ResultCode:
        $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ValidationResultCode'
      ResultDesc:
        type: string
      ThirdPartyTransID:
        description: |-
          ThirdPartyTransID is echoed back on the matching confirmation, which is
          the only way to correlate the two callbacks.
        type: string
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ValidationResultCode:
    enum:
    - "0"
    - C2B00011
    - C2B00012
    - C2B00013
    - C2B00014
    - C2B00015
    - C2B00016
    type: string
    x-enum-varnames:
    - ValidationAccepted
    - ValidationInvalidMSISDN
    - ValidationInvalidAccountNumber
    - ValidationInvalidAmount
    - ValidationInvalidKYC
    - ValidationInvalidShortcode
    - ValidationOtherError
  github_com_Shamba-Records-Limited_microvault_pkg_payment_yellowcard.SettlementInfo:
    properties:
      cryptoAmount:
        type: number
      cryptoCurrency:
        type: string
      cryptoLocalRate:
        type: number
      cryptoNetwork:
        type: string
      cryptoUSDRate:
        type: number
      expiresAt:
        type: string
      lnInvoice:
        type: string
      walletAddress:
        type: string
      walletTag:
        type: string
    type: object
  github_com_Shamba-Records-Limited_microvault_pkg_payment_yellowcard.WebhookEvent:
    properties:
      apiKey:
        type: string
      errorCode:
        type: string
      event:
        type: string
      executedAt:
        type: integer
      id:
        type: string
      sequenceId:
        type: string
      sessionId:
        type: string
      settlementInfo:
        $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_yellowcard.SettlementInfo'
      status:
        type: string
    type: object
  middleware.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: smugane@shambarecords.com
    name: API Support
  description: A headless SEP-56 tokenized vault engine for microlending built on
    the stellar network.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  termsOfService: http://swagger.io/terms/
  title: microvault API
  version: "1.0"
paths:
  /api/v1/auth/challenge:
    get:
      consumes:
      - application/json
      description: Generate a Stellar transaction challenge for authentication
      produces:
      - application/json
      responses:
        "200":
          description: Challenge generated successfully
          schema:
            $ref: '#/definitions/controllers.ChallengeResponse'
        "500":
          description: Failed to generate challenge
          schema:
            $ref: '#/definitions/middleware.Response'
      summary: Get Authentication Challenge
      tags:
      - Authentication
  /api/v1/auth/verify:
    post:
      consumes:
      - application/json
      description: Verify a signed Stellar transaction challenge and receive a JWT
        token
      parameters:
      - description: Signed challenge verification
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.VerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Challenge verified successfully
          schema:
            $ref: '#/definitions/controllers.VerifyResponse'
        "400":
          description: Invalid request body or transaction
          schema:
            $ref: '#/definitions/middleware.Response'
        "401":
          description: Challenge verification failed
          schema:
            $ref: '#/definitions/middleware.Response'
        "404":
          description: Challenge not found
          schema:
            $ref: '#/definitions/middleware.Response'
        "500":
          description: Failed to generate token
          schema:
            $ref: '#/definitions/middleware.Response'
      summary: Verify Challenge
      tags:
      - Authentication
  /api/v1/callbacks/daraja/{slug}/{kind}/result:
    post:
      consumes:
      - application/json
      description: Record the result of an asynchronous Daraja query
      parameters:
      - description: Callback slug
        in: path
        name: slug
        required: true
        type: string
      - description: Query family
        enum:
        - status
        - balance
        - reversal
        in: path
        name: kind
        required: true
        type: string
      - description: Result delivery
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ResultEnvelope'
      produces:
      - application/json
      responses:
        "200":
          description: Recorded
          schema:
            type: string
        "400":
          description: Undecodable result
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Source not permitted
          schema:
            $ref: '#/definitions/fiber.Error'
        "500":
          description: Failed to record the observation
          schema:
            $ref: '#/definitions/fiber.Error'
      summary: Record an async query result
      tags:
      - Daraja
  /api/v1/callbacks/daraja/{slug}/{kind}/timeout:
    post:
      consumes:
      - application/json
      description: Record a queue-timeout delivery as unknown for the poller to resolve
      parameters:
      - description: Callback slug
        in: path
        name: slug
        required: true
        type: string
      - description: Query family
        enum:
        - status
        - balance
        - reversal
        in: path
        name: kind
        required: true
        type: string
      - description: Timeout delivery
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ResultEnvelope'
      produces:
      - application/json
      responses:
        "200":
          description: Recorded
          schema:
            type: string
        "400":
          description: Undecodable result
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Source not permitted
          schema:
            $ref: '#/definitions/fiber.Error'
        "500":
          description: Failed to record the observation
          schema:
            $ref: '#/definitions/fiber.Error'
      summary: Record an async queue timeout
      tags:
      - Daraja
  /api/v1/callbacks/daraja/{slug}/c2b/confirmation:
    post:
      consumes:
      - application/json
      description: Record a settled C2B payment as an observation for the poller to
        confirm
      parameters:
      - description: Callback slug
        in: path
        name: slug
        required: true
        type: string
      - description: Confirmation notification
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.C2BNotificationWire'
      produces:
      - application/json
      responses:
        "200":
          description: Recorded
          schema:
            type: string
        "400":
          description: Undecodable confirmation
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Source not permitted
          schema:
            $ref: '#/definitions/fiber.Error'
        "500":
          description: Failed to record the observation
          schema:
            $ref: '#/definitions/fiber.Error'
      summary: Record a C2B confirmation
      tags:
      - Daraja
  /api/v1/callbacks/daraja/{slug}/c2b/validation:
    post:
      consumes:
      - application/json
      description: Decide whether to accept an incoming C2B payment. Any answer other
        than ResultCode 0 rejects it.
      parameters:
      - description: Callback slug
        in: path
        name: slug
        required: true
        type: string
      - description: Validation notification
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.C2BNotificationWire'
      produces:
      - application/json
      responses:
        "200":
          description: Accept/reject decision
          schema:
            $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ValidationResponse'
        "400":
          description: Undecodable notification
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Source not permitted
          schema:
            $ref: '#/definitions/fiber.Error'
      summary: Validate a C2B payment
      tags:
      - Daraja
  /api/v1/callbacks/daraja/{slug}/hakikisha/oauth/token:
    post:
      description: Issue a bearer token for the Hakikisha resolve endpoint
      parameters:
      - description: Callback slug
        in: path
        name: slug
        required: true
        type: string
      - description: Must be client_credentials
        in: query
        name: grant_type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: access_token, expires_in
          schema:
            additionalProperties: true
            type: object
        "401":
          description: errorCode, errorMessage
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Source not permitted
          schema:
            $ref: '#/definitions/fiber.Error'
      summary: Hakikisha OAuth token
      tags:
      - Daraja
  /api/v1/callbacks/daraja/{slug}/hakikisha/resolve:
    post:
      consumes:
      - application/json
      description: Resolve an account number to a display name for the payer's confirmation
        screen
      parameters:
      - description: Callback slug
        in: path
        name: slug
        required: true
        type: string
      - description: Resolve request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.HakikishaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Found or not-found answer
          schema:
            $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.HakikishaResponse'
        "401":
          description: errorCode, errorMessage
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Source not permitted
          schema:
            $ref: '#/definitions/fiber.Error'
        "422":
          description: Undecodable request
          schema:
            $ref: '#/definitions/fiber.Error'
      summary: Hakikisha account resolve
      tags:
      - Daraja
  /api/v1/callbacks/daraja/{slug}/stk/result:
    post:
      consumes:
      - application/json
      description: M-Pesa Express payment callback
      parameters:
      - description: Callback slug
        in: path
        name: slug
        required: true
        type: string
      - description: Express result delivery
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_mpesa.ExpressCallbackEnvelope'
      produces:
      - application/json
      responses:
        "200":
          description: Recorded or dropped
          schema:
            type: string
        "400":
          description: Undecodable callback
          schema:
            $ref: '#/definitions/fiber.Error'
        "403":
          description: Source not permitted
          schema:
            $ref: '#/definitions/fiber.Error'
        "500":
          description: Failed to record the observation
          schema:
            $ref: '#/definitions/fiber.Error'
      summary: Record an STK push result
      tags:
      - Daraja
  /api/v1/mobile/sms/{provider}/delivery:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Handle incoming SMS delivery report callbacks from Africa's Talking
      parameters:
      - description: AT message ID
        in: formData
        name: id
        required: true
        type: string
      - description: Delivery status
        in: formData
        name: status
        required: true
        type: string
      - description: Recipient phone number
        in: formData
        name: phoneNumber
        type: string
      - description: Network code
        in: formData
        name: networkCode
        type: string
      - description: Failure reason (if applicable)
        in: formData
        name: failureReason
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: Invalid callback payload
          schema:
            $ref: '#/definitions/fiber.Error'
      summary: Process SMS Delivery Report
      tags:
      - Mobile
  /api/v1/mobile/ussd/{provider}:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Handle USSD callback requests from the USSD gateway. The provider
        is specified in the URL path.
      parameters:
      - description: USSD provider name (e.g. africastalking)
        in: path
        name: provider
        required: true
        type: string
      - description: Session ID
        in: formData
        name: sessionId
        required: true
        type: string
      - description: User's phone number
        in: formData
        name: phoneNumber
        required: true
        type: string
      - description: User input text
        in: formData
        name: text
        type: string
      - description: USSD service code
        in: formData
        name: serviceCode
        required: true
        type: string
      - description: Network code
        in: formData
        name: networkCode
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: USSD response (CON/END)
          schema:
            type: string
        "500":
          description: END An error occurred. Please try again.
          schema:
            type: string
      summary: USSD Callback Handler
      tags:
      - Mobile
  /api/v1/webhooks/yellowcard:
    post:
      consumes:
      - application/json
      description: Handle incoming webhooks from YellowCard payment service
      parameters:
      - description: HMAC signature for verification
        in: header
        name: X-YC-Signature
        required: true
        type: string
      - description: Webhook event data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Shamba-Records-Limited_microvault_pkg_payment_yellowcard.WebhookEvent'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: Invalid webhook payload
          schema:
            $ref: '#/definitions/fiber.Error'
        "401":
          description: Signature verification failed
          schema:
            $ref: '#/definitions/fiber.Error'
        "500":
          description: Failed to process webhook
          schema:
            $ref: '#/definitions/fiber.Error'
      summary: Process YellowCard Payment Webhook
      tags:
      - Webhooks
swagger: "2.0"
