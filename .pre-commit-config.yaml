repos:
  # Golang project hooks
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: golangci-lint
        pass_filenames: false
        args:
          - "--fix=false"
          - "--allow-parallel-runners=true"
      - id: go-mod-tidy

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: '(cmd/.*/docs/.*\.html|cmd/.*/docs/.*\.json|cmd/.*/docs/.*\.yaml|cmd/.*/docs/.*\.go)$'
      - id: trailing-whitespace
        exclude: '(cmd/.*/docs/.*\.html|cmd/.*/docs/.*\.json|cmd/.*/docs/.*\.yaml|cmd/.*/docs/.*\.go)$'
      - id: check-added-large-files
        exclude: '(cmd/.*/docs/.*\.html|cmd/.*/docs/.*\.json|cmd/.*/docs/.*\.yaml|cmd/.*/docs/.*\.go)$'
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]

  # Rust project hooks
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Cargo fmt (Soroban)
        entry: bash -c 'cd soroban && cargo fmt --all -- --check'
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: Cargo clippy (Soroban)
        entry: bash -c 'cd soroban && cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-check
        name: Cargo check (Soroban)
        entry: bash -c 'cd soroban && cargo check --all-targets'
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-audit
        name: Cargo audit (Soroban)
        entry: bash -c 'cd soroban && cargo audit'
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-test
        name: Cargo test (Soroban)
        entry: bash -c 'cd soroban && cargo test --workspace'
        language: system
        pass_filenames: false
        types: [rust]

  # Web project hooks
  - repo: local
    hooks:
      - id: oxlint
        name: Lint with oxlint
        entry: bash -c 'cd web && npm run lint'
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx, json]

      - id: typescript-check
        name: TypeScript type check
        entry: bash -c 'cd web && npm run typecheck'
        language: system
        pass_filenames: false
        types_or: [ts, tsx]
