name: Build & Deploy Web - Staging

on:
  push:
    branches: ["staging"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=staging-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_VAULT_CONTRACT_ID=${{ vars.VITE_VAULT_CONTRACT_ID }}
            VITE_SOROBAN_RPC_URL=${{ vars.VITE_SOROBAN_RPC_URL }}
            VITE_NETWORK_PASSPHRASE=${{ vars.VITE_NETWORK_PASSPHRASE }}
            VITE_STELLAR_EXPLORER_URL=${{ vars.VITE_STELLAR_EXPLORER_URL }}
